<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Date ❤️</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #ffd6e5, #fff1f6);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    .container {
        width: 92%;
        max-width: 520px;
        text-align: center;
        background: rgba(255,255,255,0.9);
        padding: 30px 20px;
        border-radius: 25px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    }

    .heart {
        font-size: 55px;
        animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
        0%,100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.15);
        }
    }

    h1 {
        color: #d94f70;
        font-size: 30px;
        margin: 10px 0;
    }

    p {
        color: #666;
        font-size: 17px;
    }

    .buttons {
        margin-top: 25px;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 14px 30px;
        margin: 8px;
        font-size: 17px;
        cursor: pointer;
        transition: 0.25s;
    }

    button:hover {
        transform: scale(1.07);
    }

    .yes {
        background: #43b879;
        color: white;
    }

    .no {
        background: #e66b6b;
        color: white;
    }

    .hidden {
        display: none;
    }

    #dateSection {
        animation: appear 0.6s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h2 {
        color: #d94f70;
        margin-top: 25px;
    }

    /* MEETING PLACES */

    .places {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 15px;
    }

    .place {
        background: #fff0f4;
        border: 2px solid transparent;
        border-radius: 16px;
        padding: 18px 8px;
        cursor: pointer;
        transition: 0.25s;
        color: #444;
    }

    .place:hover {
        transform: translateY(-4px);
        background: #ffe1eb;
    }

    .place.selected {
        border: 2px solid #d94f70;
        background: #ffd4e2;
    }

    .emoji {
        font-size: 30px;
        display: block;
        margin-bottom: 7px;
    }

    .special {
        color: #d94f70;
        font-size: 13px;
    }

    /* DATE & TIME */

    .input-group {
        margin-top: 15px;
        text-align: left;
    }

    label {
        display: block;
        margin-bottom: 6px;
        color: #555;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
    }

    .confirm {
        width: 90%;
        background: #d94f70;
        color: white;
        margin-top: 20px;
    }

    #result {
        display: none;
        margin-top: 20px;
        padding: 20px;
        border-radius: 15px;
        background: #edfff4;
        color: #267344;
        line-height: 1.7;
    }

    /* FLOATING HEARTS */

    .floating-heart {
        position: fixed;
        bottom: -30px;
        font-size: 22px;
        animation: floatUp 5s linear infinite;
        pointer-events: none;
    }

    @keyframes floatUp {
        0% {
            transform: translateY(0);
            opacity: 1;
        }

        100% {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }

    @media(max-width: 450px) {

        h1 {
            font-size: 25px;
        }

        .places {
            grid-template-columns: 1fr;
        }

        .container {
            padding: 25px 15px;
        }
    }
</style>
</head>


<body>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Will You Go on a Date With Me?</h1>

    <p>
        I have a special invitation for you 😊
    </p>

    <!-- YES / NO -->

    <div class="buttons">

        <button class="yes" onclick="sayYes()">
            YES ❤️
        </button>

        <button class="no" onclick="sayNo()">
            NO 😢
        </button>

    </div>


    <!-- AFTER YES -->

    <div id="dateSection" class="hidden">

        <p>
            Yay! ❤️ I knew you would say yes!
        </p>

        <h2>📍 Where should we meet?</h2>

        <div class="places">

            <div class="place"
                 onclick="choosePlace(this, 'The Baobab')">

                <span class="emoji">🌳</span>

                <strong>The Baobab</strong>

            </div>


            <div class="place"
                 onclick="choosePlace(this, 'Pizzeria')">

                <span class="emoji">🍕</span>

                <strong>Pizzeria</strong>

            </div>


            <div class="place"
                 onclick="choosePlace(this, 'KFC')">

                <span class="emoji">🍗</span>

                <strong>KFC</strong>

            </div>


            <div class="place"
                 onclick="choosePlace(this, 'Mambo')">

                <span class="emoji">🌴</span>

                <strong>Mwambao</strong>

            </div>


            <div class="place"
                 onclick="choosePlace(this, 'Golden Fork')">

                <span class="emoji">🍴</span>

                <strong>Golden Fork</strong>

            </div>


            <div class="place"
                 onclick="choosePlace(this, 'Guest House')">

                <span class="emoji">🏠</span>

                <strong>Guest House</strong>

                <br>

                <span class="special">
                    For something special 😂
                </span>

            </div>

        </div>


        <!-- DATE -->

        <h2>📅 Choose Date & Time</h2>


        <div class="input-group">

            <label for="date">
                Choose the date:
            </label>

            <input
                type="date"
                id="date"
            >

        </div>


        <div class="input-group">

            <label for="time">
                Choose the time:
            </label>

            <input
                type="time"
                id="time"
            >

        </div>


        <button
            class="confirm"
            onclick="confirmDate()">

            💕 Confirm Our Date

        </button>


        <!-- RESULT -->

        <div id="result"></div>

    </div>

</div>


<script>

    let selectedPlace = "";


    // WHEN YES IS CLICKED

    function sayYes() {

        document
            .getElementById("dateSection")
            .classList
            .remove("hidden");

        createHearts();

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    }


    // WHEN NO IS CLICKED

    function sayNo() {

        alert(
            "Awww 😢 Think about it again ❤️"
        );

    }


    // SELECT MEETING PLACE

    function choosePlace(element, place) {

        // Remove previous selection

        document
            .querySelectorAll(".place")
            .forEach(function(item) {

                item.classList.remove("selected");

            });


        // Select current place

        element.classList.add("selected");

        selectedPlace = place;

    }


    // CONFIRM DATE

    function confirmDate() {

        const date =
            document.getElementById("date").value;

        const time =
            document.getElementById("time").value;

        const result =
            document.getElementById("result");


        if (selectedPlace === "") {

            alert(
                "Please choose where we should meet ❤️"
            );

            return;
        }


        if (date === "") {

            alert(
                "Please choose a date 📅"
            );

            return;
        }


        if (time === "") {

            alert(
                "Please choose a time ⏰"
            );

            return;
        }


        result.style.display = "block";


        result.innerHTML = `

            ❤️ <strong>It's a Date!</strong>

            <br><br>

            📍 Meeting place:
            <strong>${selectedPlace}</strong>

            <br>

            📅 Date:
            <strong>${date}</strong>

            <br>

            ⏰ Time:
            <strong>${time}</strong>

            <br><br>

            Can't wait to see you 😍❤️

        `;


        createHearts();

    }


    // CREATE FLOATING HEARTS

    function createHearts() {

        for (let i = 0; i < 8; i++) {

            const heart =
                document.createElement("div");

            heart.className =
                "floating-heart";

            heart.innerHTML = "❤️";

            heart.style.left =
                Math.random() * 100 + "%";

            heart.style.animationDuration =
                (3 + Math.random() * 4) + "s";

            document.body.appendChild(heart);


            setTimeout(function() {

                heart.remove();

            }, 7000);

        }

    }

</script>

</body>
